# Ahmet Özel, Hanefî Fıkıh Âlimleri (Ankara: TDV, 1990; genişletilmiş baskı) esas alınarak yapılan düzeltme ve eklemeler.
# Kitabın metni depoda yoktur; burada yalnız eşleştirilen kişiler için çıkarılan bilgiler ve kısa kanıt cümleleri durur.
# Dipnotlar metne karışık olduğu için dipnot satırları ayıklanmış, bilgi yalnız madde metninden alınmıştır.
# Kişi kimliği → alanlar:
#   madde, sayfa        kitaptaki madde başlığı ve sayfası (kanıt atfı için)
#   ad, kisa            tam ad ve kısa ad (sitedeki ad kitaptakiyle çelişiyorsa; kısa ad değişmez). Sitedeki ad kitabınkinin
#                       içinde kalıyorsa (yalnız eksikse) dokunulmaz; imlâ sitenin (DİA) imlâsına çevrilmiştir.
#   vefat, dogum        hicrî yıl; yaklasik: true → kitapta "…’den sonra", "civarı", "?" (site tahminî gösterir)
#   eserler             kitaptaki eser listesi
#   hocalar, talebeler  [kimlik, bağ türü]  (fiqh, took, hadith, read, companion); kanit: kimlik → metinden cümle
#   dis_hocalar         [Arapça ad, Türkçe ad, vefat, bağ türü]  biyografisi bu kitaplarda olmayanlar
#   yerler              [yer kimliği, tür]
