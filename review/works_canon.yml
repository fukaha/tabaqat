# Kitap ağının omurgası: Hanefî literatürünün temel metinleri ve bunların meşhur şerh/hâşiye/ihtisarları.
# Tabakat metinlerinden ve Hanefî Fıkıh Âlimleri'nden çıkarılan eser adları bu kayıtlara (ad ya da takma adlarıyla)
# bağlanır; "Şerhu X" / "شرح X" biçimindeki adlar X'e şerh olarak eklenir.
#   id        kısa kimlik (site adresinde #/kitap/<id>)
#   ar, tr    Arapça ve Türkçe ad; ar_alt / tr_alt: metinlerde geçen öteki adlar
#   author    sitedeki müellif kimliği; müellif sitede yoksa author_tr ve year (müellifin hicrî vefatı)
#   kind      asl (ana metin), sharh, hashiya, ikhtisar, nazm, tekmile, tahric, fetava
#   base      şerh / hâşiye / ihtisar ise dayandığı eserin kimliği
# Fıkıh: zâhirü'r-rivâye
