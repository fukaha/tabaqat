[project]
name = "tabaqat"
version = "0.1.0"
description = "Hanafi biographical dictionaries: parse, unify, network, geography"
requires-python = ">=3.10"
dependencies = ["pyyaml", "beautifulsoup4", "lxml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["tabaqat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
