name: pages
# site/ (index.html, app.js, app.css, data/) GitHub Pages'e yayımlanır.
# site/data, pipeline'ın "python -m tabaqat.cli site" çıktısıdır ve depoda tutulur.
on:
  push:
    branches: [main, claude/practical-clarke-8an6jy]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # telifli neşirlerin tam metni yayımlanmaz: t/ parçalarında yalnız kısa alıntı olmalı
      # (tam metin parçaları gizli fukaha/tabaqat-kaynak deposundadır; site onları yalnız yönetici girişiyle okur)
      - name: Biyografi metinleri kısa alıntı mı?
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          long = [(f, pid) for f in glob.glob("site/data/t/*.json")
                  for pid, items in json.load(open(f, encoding="utf-8")).items()
                  for it in items if len(it["text"]) > 400]
          if long:
              sys.exit(f"{len(long)} madde tam metin görünüyor (ör. {long[:3]}); 'tabaqat.cli site' ile yeniden üretilmeli.")
          EOF
      - name: Siteyi topla (onay sayfaları hariç)
        run: |
          mkdir _site
          cp site/index.html site/app.js site/app.css _site/
          cp -r site/data _site/data
          touch _site/.nojekyll
          v=${GITHUB_SHA::8}
          sed -i -e "s|href=\"app.css\"|href=\"app.css?v=$v\"|" -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" _site/index.html
          grep -q "app.js?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
