name: pages
# site/ (index.html, app.js, app.css, data/) GitHub Pages'e yayımlanır.
# site/data, pipeline'ın "python -m tabaqat.cli site" çıktısıdır ve depoda tutulur.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi topla (onay sayfaları hariç)
        run: |
          mkdir _site
          cp site/index.html site/app.js site/app.css _site/
          cp -r site/data _site/data
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
